<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>擲骰人生</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eef2;--fg:#14202b;--card:#f7fafb;--mut:#5d6d7a;--ac:#0f7c80;--gold:#c98a0a;--bd:#cfdae1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--fg:#e6eef3;--card:#18262f;--mut:#8ea0ad;--ac:#4fd1c5;--gold:#f0b94a;--bd:#2a3b46;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a22;--fg:#e6eef3;--card:#18262f;--mut:#8ea0ad;--ac:#4fd1c5;--gold:#f0b94a;--bd:#2a3b46;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;line-height:1.6}
.serif{font-family:"Noto Serif TC","Songti TC",serif}
.screen{display:none;flex:1;min-height:0;flex-direction:column;padding:18px 18px 14px;max-width:560px;width:100%;margin:0 auto}
.screen.on{display:flex}
#start{justify-content:safe center;gap:18px;overflow-y:auto}
#start h1{font-size:46px;line-height:1.15;margin:0;font-weight:800}
#start p{margin:0;color:var(--mut);max-width:30em}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:14px 20px;font-weight:700;font-size:17px;align-self:flex-start}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#06201f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn{color:#fff}}
.btn:focus-visible,.opt:focus-visible,.ctl:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.note{font-size:13px;color:var(--mut)}
#top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--fg);padding-bottom:8px}
#place{font-size:20px;font-weight:700}
#sub{font-size:13px;color:var(--mut)}
#foc{background:var(--card,#fff);border:1px solid var(--line,#d6dde3);border-radius:14px;padding:12px;margin:10px 0}
#foc .fh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}#foc .fh b{font-size:16px}#foc .fh span{font-size:11.5px;color:var(--mut)}
#foc .fl{font-size:13px;color:var(--mut);margin-bottom:8px}#foc .fl b{color:inherit}
#foc .fr{display:flex;flex-wrap:wrap;gap:6px}
#foc .fb{border:1px solid var(--line,#cdd5db);background:transparent;border-radius:12px;padding:6px 10px;text-align:left;cursor:pointer;font:inherit;color:inherit}
#foc .fb b{display:block;font-size:13px}#foc .fb small{display:block;font-size:10.5px;color:var(--mut)}
#foc .fb.on{background:#0f6b63;color:#fff;border-color:#0f6b63}#foc .fb.on small{color:#d6efec}
#foc .fb2{margin-top:8px;border:1px solid var(--line,#cdd5db);background:transparent;border-radius:10px;padding:6px 12px;cursor:pointer;font:inherit;color:inherit}
#foc .fc{font-size:12px;color:var(--mut);margin-top:8px}
.ev.poem span{white-space:pre-line;line-height:1.7}
#resd{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.4}
#resd b{color:var(--ink,inherit);font-weight:600}
#age{font-size:64px;line-height:.9;font-weight:800;font-variant-numeric:tabular-nums}
#age small{font-size:16px;font-weight:500;margin-left:4px;color:var(--mut)}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin:12px 0}
.st{font-size:13px}
.st div.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:3px;overflow:hidden}
.st div.bar i{display:block;height:100%;width:50%;background:var(--ac);transition:width .5s}
.st.w i{background:var(--gold)}
#log{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--bd);padding-top:6px;scroll-behavior:smooth}
.ev{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:15px}
.ev b{color:var(--mut);font-weight:500;font-variant-numeric:tabular-nums}
.ev.pick{color:var(--ac)}
#ch{display:none;flex-direction:column;gap:8px;padding:10px 0 4px}
#ch.on{display:flex}
#ch p{margin:0 0 2px;font-weight:700}
.opt{background:var(--card);border:2px solid var(--fg);border-radius:10px;padding:12px 14px;text-align:left;font-size:16px}
.opt:active{background:var(--ac);color:#fff}
#bar{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px}
.ctl{flex:1 1 28%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:15px}
#end{justify-content:center;gap:14px}
#end h2{font-size:34px;margin:0;line-height:1.2}
#sum{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;font-size:15px}
#sum div{display:flex;justify-content:space-between;padding:3px 0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mut)}
select,input[type=number],input[type=text]{font:inherit;color:var(--fg);background:var(--card);border:2px solid var(--fg);border-radius:10px;padding:11px 12px;font-size:16px;width:100%}
select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#gf{display:none;flex-direction:column;gap:8px;padding:10px 0 4px}
#gf.on{display:flex}
#gf p{margin:0;font-weight:700}
#gf .row{display:flex;gap:8px}
#gf .row button{flex:1}
#qp{display:none;flex-direction:column;gap:8px;padding:10px 0 4px}
#qp.on{display:flex}
#qp p{margin:0;font-weight:700}
#pe{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin:0 0 8px}
#pe .dd{opacity:.5}
#sum p.note{margin:6px 0 0}
.ctl.on{border-color:var(--ac);color:var(--ac);font-weight:700}
.pg{height:4px;background:var(--bd);border-radius:2px;margin:8px 0 0}.pg i{display:block;height:100%;width:0;background:var(--gold);border-radius:2px;transition:width .4s}
#ch,#gf,#qp,#sp{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);max-height:82vh;overflow-y:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;z-index:20;box-shadow:0 0 0 100vmax rgba(10,20,28,.55)}
#sp{display:none;flex-direction:column;gap:8px}
#sp.on{display:flex}
#spl{display:flex;flex-direction:column;gap:8px}
#chq,#spt{font-size:13px;color:var(--ac);font-weight:700}
.opt:disabled{opacity:.45}
#pf{overflow-y:auto;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:15px}
.kv b{text-align:right}
#fin{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:13px;margin:0 0 8px}
#ld1,#ld2{fill:var(--bd);stroke:var(--mut);stroke-width:.3}
#ld2{stroke-width:.12}
#gr1,#gr2{stroke:var(--bd);stroke-width:.2;fill:none}
#gr2{stroke-width:.08}
.sec{display:block;font-weight:700;font-size:14px;margin-top:8px}
.pr{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font-size:14px}
.pill.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}

#game{overflow-y:auto}
#game>*{flex-shrink:0}
#log{flex:none;min-height:140px;max-height:42vh;overflow-y:auto}
#bar{position:sticky;bottom:0;background:var(--bg);padding-bottom:8px;margin-top:auto}
.cdrow{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:4px 0 8px}
.pg{height:6px}.pg i{background:var(--gold);transition:none}
#scard{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:8px}
#scn{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
#scap{padding:8px 12px 0;font-weight:700;font-size:15px}
#sfam{padding:0 12px 10px;font-size:13px;color:var(--mut)}
.st.r{grid-column:1/-1}
#fin small{grid-column:1/-1;color:var(--mut);font-size:11px}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{font-size:12px;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:2px 10px}
#ch .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
#ch .mh2{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ac);font-variant-numeric:tabular-nums}
#ch h3{margin:2px 0 8px;font-size:18px;line-height:1.5}
.hintbar{margin:0 0 10px!important;padding:8px 12px;border-left:3px solid var(--ac);background:rgba(15,124,128,.12);font-size:13px;font-weight:400!important;color:var(--fg)}
#cho{display:flex;flex-direction:column;gap:8px}
#ch .opt{display:flex;gap:12px;align-items:flex-start;width:100%}
#ch .opt .on{color:var(--mut);font-variant-numeric:tabular-nums;flex:none;width:1.2em}
#ch .opt .ot{display:flex;flex-direction:column}
#ch .opt small{color:var(--mut);font-size:13px;margin-top:2px}
#ch.min{display:none!important}
#cha{margin-top:10px;align-self:center}
#chm{display:none;position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:25;background:var(--ac);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#chm.on{display:block}
#ch{box-shadow:0 0 0 100vmax rgba(10,20,28,.55)}
#sp{padding:0;gap:0}
#sph{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--card);padding:14px 16px;border-bottom:1px solid var(--bd);z-index:2}
#spn2{flex:1;font-size:12px;color:var(--mut);text-align:right}
#spb{display:flex;flex-direction:column;gap:10px;padding:12px 16px}
#sp>.opt{margin:4px 16px 16px}
.spc{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;position:relative}
.spc.off{opacity:.55}
.spc.act{border-color:#a2314c}
.spt{font-weight:700}
.spd{font-size:13px;color:var(--mut)}
.spr{font-size:14px;font-variant-numeric:tabular-nums;align-self:flex-end;color:var(--fg)}
.sppr{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sppr .pill:disabled{opacity:.45}
.sppr small{color:var(--mut);font-variant-numeric:tabular-nums}
.spsec{background:none;border:0;border-top:1px solid var(--bd);text-align:left;font-weight:700;padding:12px 0 4px;font-size:15px}
.ev.news{color:var(--gold)}
@media (prefers-reduced-motion:reduce){.st i{transition:none}#log{scroll-behavior:auto}}
#stats{display:flex;gap:6px;margin:8px 0 6px;padding:8px 10px;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.st{flex:1;min-width:0;font-size:11px;color:var(--mut)}
.st span{display:block;line-height:1.2}
.st b{display:block;font-size:19px;line-height:1.15;color:var(--fg);font-variant-numeric:tabular-nums}
.st div.bar{height:4px;margin-top:3px}
#stbar{display:flex;gap:8px;margin:0 0 8px}
.pl2{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font-size:14px}
#focbtn{flex:1;text-align:left;display:flex;justify-content:space-between;gap:6px}
#focbtn b{color:var(--ac)}
#spn{flex:none;font-weight:700}
#foc{padding:0;border:0;background:none;margin:0 0 6px}
#foc .fl{margin:0 0 2px}
#md{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,520px);max-height:82vh;overflow-y:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:0;z-index:30;box-shadow:0 0 0 100vmax rgba(10,20,28,.55);display:none;flex-direction:column}
#md.on{display:flex}
#mdh{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--card);padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:700}
#mdb{display:flex;flex-direction:column;gap:8px;padding:12px 16px 16px}
#md .fb{border:1px solid var(--bd);background:transparent;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit;color:inherit}
#md .fb b{display:block;font-size:15px}#md .fb small{display:block;font-size:12px;color:var(--mut)}
#md .fb.on{background:#0f6b63;color:#fff;border-color:#0f6b63}#md .fb.on small{color:#d6efec}
#bar .ctl{flex:1 1 17%;padding:10px 4px;font-size:14px}
#chb{white-space:pre-line}
#cont{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
</style>
</head>
<body>

<section id="start" class="screen on">
  <h1 class="serif">擲骰人生</h1>
  <p id="modeNote">出生地依各國出生人數隨機決定，家庭背景依該國經濟水準隨機決定。</p>
    <div id="devf" style="display:none;flex-direction:column;gap:18px">
  <label class="fld">國籍<select id="selC"></select></label>
  <label class="fld" id="fL" style="display:none"><span id="fLt">家族</span><select id="selL"></select></label>
  <label class="fld">家世背景<select id="selF"></select></label>
  <label class="fld">出生日期（留空則隨機）<input type="date" id="selD"></label>
  <button class="pill" id="rd" type="button" style="align-self:flex-start">隨機一個日期</button>
  <label class="fld">名字（留空則隨機生成）<input type="text" id="selN" maxlength="20"></label>
  </div>
  <button class="btn" id="go">出生</button>
  <button class="btn" id="cont" type="button" style="display:none">繼續上次的人生</button>
  <p class="note">原型版。金額皆以新台幣顯示（依當地物價換算的體感金額）；各國數字是為了遊戲效果而簡化的示意值，不是精確統計。清單包含主權國家與各地區，名稱僅供選擇，不代表任何主權立場。</p>
</section>

<div id="spin" style="display:none;position:fixed;inset:0;z-index:50;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center"><div style="font-size:14px;color:var(--mut)" id="spT">正在決定出生地</div><div class="serif" id="spN" style="font-size:44px;font-weight:700"></div><div style="font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums" id="spP"></div></div>

<section id="pf" class="screen">
  <h2 class="serif" style="margin:0">出生簡歷</h2>
  <svg id="mp" viewBox="0 0 360 180" role="img" aria-label="世界地圖" style="width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;flex:none"><g id="gr1"></g><g id="ld1"></g><circle id="mk2" r="8" fill="none" stroke="var(--ac)" stroke-width="1.5"/><circle id="mk" r="3.5" fill="var(--ac)"/></svg>
  <svg id="mp2" viewBox="0 0 60 30" role="img" aria-label="出生位置放大圖" style="width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;flex:none"><g id="gr2"></g><g id="ld2"></g><circle id="zk2" r="1.6" fill="none" stroke="var(--ac)" stroke-width=".3"/><circle id="zk" r=".7" fill="var(--ac)"/><text id="zt" font-size="1.8" fill="var(--fg)"></text></svg>
  <p class="note" id="coord"></p>
  <div id="pfl"></div>
  <button class="btn" id="begin">開始人生</button>
</section>

<section id="game" class="screen">
  <div id="top">
    <div style="min-width:0"><div id="place" class="serif"></div><div id="sub"></div><div id="resd"></div></div>
    <div id="age" class="serif">0<small>歲</small></div>
  </div>
  <div class="pg"><i id="pgi"></i></div>
  <div class="cdrow"><span id="cd"></span><span>1 年 ≈ 30 秒（1x）</span></div>
  <div id="scard"><canvas id="scn" width="200" height="62" aria-label="像素風場景"></canvas><div id="scap"></div><div id="sfam"></div></div>
  <div id="stats">
    <div class="st"><span>健康</span><b id="v-h"></b><div class="bar"><i id="s-h"></i></div></div>
    <div class="st w"><span>財富</span><b id="v-w"></b><div class="bar"><i id="s-w"></i></div></div>
    <div class="st"><span>知識</span><b id="v-k"></b><div class="bar"><i id="s-k"></i></div></div>
    <div class="st"><span>幸福</span><b id="v-j"></b><div class="bar"><i id="s-j"></i></div></div>
    <div class="st"><span>關係</span><b id="v-r"></b><div class="bar"><i id="s-r"></i></div></div>
  </div>
  <div id="stbar"><button class="pl2" id="focbtn" type="button"></button><button class="pl2" id="spn" type="button">花錢</button></div>
  <div id="fin"></div>
  <div id="chips"></div>
  <div id="foc"></div>
  <div id="pe"></div>
  <div id="log" aria-live="polite"></div>
  <div id="ch"><div class="mh"><span id="chq"></span><span class="mh2"><span id="chy"></span><button id="chc" class="pill" type="button">先收起來 ▾</button></span></div><h3 id="chb"></h3><p id="chh" class="hintbar"></p><div id="cho"></div><button class="pill" id="cha" type="button">從現在起把抉擇交給自動</button></div>
  <button id="chm" type="button">有一個抉擇等你決定，點此展開</button>
  <div id="gf"><p id="gq"></p><input type="number" id="gamt" min="0" step="any" inputmode="decimal" placeholder="輸入金額（新台幣）" aria-label="金額（新台幣）"><div class="row"><button class="opt" id="gok">給他這筆錢</button><button class="opt" id="gno">不給</button></div></div>
  <div id="qp"><p id="qq"></p><input type="text" id="qa" maxlength="60" placeholder="寫一行字（可留白）" aria-label="留下一行字"><button class="opt" id="qok">繼續</button></div>
  <div id="sp"><div id="sph"><span id="spt">花錢・投資</span><span id="spn2"></span><button id="spx" class="pill" type="button">關閉</button></div><div id="spb"></div><button class="opt" id="spx2" style="align-self:center">關閉</button></div>
  <div id="md"><div id="mdh"><span id="mdt"></span><button id="mdx" class="pill" type="button">關閉</button></div><div id="mdb"></div></div>
  <div id="bar">
    <button class="ctl" id="pause">暫停</button>
    <button class="ctl" id="spd">速度 1x</button>
    <button class="ctl" id="atk">自動抉擇</button>
    <button class="ctl" id="nxt">下一歲</button>
    <button class="ctl" id="svb">存檔</button>
  </div>
</section>

<section id="end" class="screen">
  <h2 class="serif" id="etitle"></h2>
  <div id="sum"></div>
  <input type="text" id="fw" maxlength="80" placeholder="對這個人說一句話，按 Enter 送出（可留白）" aria-label="對這個人說一句話">
  <button class="btn" id="again">再擲一次</button>
</section>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var R=Math.random,ri=function(a,b){return a+Math.floor(R()*(b-a+1))},cl=function(v){return Math.max(0,Math.min(100,v))};

var C0=[
{n:"中國",f:"🇨🇳",e:78,t:3,w:18},{n:"印度",f:"🇮🇳",e:70,t:2,w:18},{n:"美國",f:"🇺🇸",e:79,t:5,w:4},
{n:"印尼",f:"🇮🇩",e:71,t:2,w:4},{n:"奈及利亞",f:"🇳🇬",e:55,t:1,w:4},{n:"巴西",f:"🇧🇷",e:76,t:3,w:3},
{n:"孟加拉",f:"🇧🇩",e:73,t:2,w:3},{n:"日本",f:"🇯🇵",e:84,t:5,w:2},{n:"衣索比亞",f:"🇪🇹",e:67,t:1,w:2},
{n:"剛果民主共和國",f:"🇨🇩",e:62,t:1,w:2},{n:"德國",f:"🇩🇪",e:81,t:5,w:1},{n:"台灣",f:"🇹🇼",e:81,t:4,w:1}

function moneyTick(){
  var ji=jobInfo(),rt=resTier(),m=mkt(s.by+s.age),P0=P(),yr=s.by+s.age;
  if(s.age===18){var g0=Math.min(s.gift||0,s.sav),sd=(s.sav-g0)*(s.fam>=4?.3:.18)+g0;log('成年了，家裡給你一筆起步金：'+NT(sd)+(g0>0?'（含你當年給的那筆錢）':'')+'。');s.sav=sd}
  var inc=ji.i*12;
  if(s.partner&&s.partner.stage>=1&&s.partner.alive!==false)inc+=s.partner.inc*.5;
  var kidsN=s.kids.filter(function(b){return s.age-b<22}).length;
  var sr=[0,.02,.04,.07,.09,.11][rt]-Math.min(.12,kidsN*.04)+(s.fin===9?0:0);
  if(s.age>=18){
    if(s.ret){earn(inc);pay(P0*.6)}
    else if(s.biz&&s.bs){}
    else if(ji.i>0||inc>0){earn(Math.max(0,inc*sr))}
    else if(!s.study&&s.age<65&&!s.mil){pay(P0*.3)}
    if(s.home===1)pay(P0*.16);
    if(s.home===2){pay(houseVal()*.01)}
    if(s.mort>0){var pr=s.mort0/25+s.mort*[0,.07,.06,.045,.03,.03][rt]*.8;pay(pr);s.mort=Math.max(0,s.mort-s.mort0/25);if(s.mort<=0){s.mort=0;log('房貸終於還清了。')}}
    if(s.car)pay(P0*.06);if(s.parImm)pay(P0*.05);
    if(s.rent>0){earn(s.rent*.035);}
    if(s.debt>0){s.debt*=1+[0,.12,.09,.06,.045,.04][rt];var rp=Math.min(s.debt,Math.max(inc*.15,s.debt*.08),s.sav);s.sav-=rp;s.debt-=rp;if(s.debt>P0*12)s.debt=P0*12;if(s.debt<1)s.debt=0;syncW()}
  }else{s.sav*=1.01}
  // 投資報酬
  if(s.age>=18&&s.sav>0){
    var f=mktOpen()?s.fin:1,r=0;
    if(f===1)r=.012+gauss()*.004;else if(f===4)r=m.b;else if(f===5)r=.5*m.s+.5*m.b;else if(f===2)r=m.s;else if(f===6)r=m.s*.95-.005+gauss()*.02;else if(f===7)r=m.s*.9-.012+gauss()*.12;
    s.sav*=1+r;
    if([2,5,6,7].indexOf(f)>-1&&s.sav>P0*.5&&mktOpen()){
      if(m.cr)schLog(.3,'【新聞】'+yr+'年全球股市重挫約 '+Math.round(-m.s*100)+'%，你持有的投資大幅縮水。');
      else if(m.s>=.3)schLog(.3,'【新聞】'+yr+'年全球股市大漲約 '+Math.round(m.s*100)+'%，你的投資水漲船高。');
    }
  }
  // 房產
  if(s.hv>0)s.hv*=1+m.re;if(s.rent>0)s.rent*=1+m.re;
  syncW();
}

  var ef=EDU[a];if(ef){var ev=ef();if(ev)sch(.15,function(){ask(ev)})}
  if(a>=18&&a<=28&&!s.uniOffered&&!s.nohs&&s.deg===0&&!s.study&&!s.mil&&!svcPendingBefore()){
    if(c.k==='KP'){if(s.milDone){s.uniOffered=1;var ke=kpEv();if(ke)sch(.2,function(){ask(ke)})}}
    else{s.uniOffered=1;sch(.15,function(){ask(eduOffer(1))})}}
  var v=svcInfo();
  if(v&&!s.milDone&&!s.mil&&a>=v.age&&a<=45&&!(s.deferred&&s.study)){
    if(!s.svcDrawn){s.svcDrawn=1;if(v.p<1&&R()>v.p){s.milDone=1;schLog(.2,'兵役抽籤／甄選的結果，你沒有被選上。');v=null}}
    if(v&&!s.milDone)sch(.1,function(){ask(svcEv(v))})}
  if(!svcInfo()&&a>=18&&a<=26&&!s.milCareer&&!s.enlistAsked&&!s.study&&!s.mil&&R()<.05){s.enlistAsked=1;sch(.5,function(){ask(enlistEv())})}
  if(c.k==='KP'&&s.party&&s.k>=70&&s.fam>=3&&a>=20&&a<=35&&!s.study&&!s.mil&&R()<.01)sch(.5,function(){ask(kpAbroadEv())});
  if(s.milCareer&&s.mcY!==undefined)s.mcY++;
  // 隨機事件
  var list=[];
  E.forEach(function(e,i){if(a>=e.a[0]&&a<=e.a[1]&&!(e.o&&s.done[i])&&(!e.if||e.if()))list.push([e,i])});
  worldEv().forEach(function(e){if(a>=e.a[0]&&a<=e.a[1]&&(!e.if||e.if()))list.push([e,-1])});
  if(list.length&&R()<.7){
    var tot=list.reduce(function(x,y){return x+y[0].w},0),r=R()*tot,pk=list[0];
    for(var i=0;i<list.length;i++){r-=list[i][0].w;if(r<0){pk=list[i];break}}
    var e=pk[0];if(e.o&&pk[1]>=0)s.done[pk[1]]=1;if(e.mk)e=e.mk();
    if(e.ch){sch(.3+R()*.45,function(){ask(e)})}
    else sch(.1+R()*.8,function(){log(e.t);var m=apply(e.fx);if(m)log(m)},false);
  }
}
function die(){
  s.alive=false;slotDel('a');$("ch").classList.remove("on");$('chm').classList.remove('on');
  var low=s.h<25;
  log(s.dieMsg||(low?"身體撐不下去了，你離開了這個世界。":"你在平靜中離開了這個世界。"));
  setTimeout(function(){
    $("etitle").textContent=s.name+"　"+s.c.f+" "+s.c.n+"，"+s.age+" 歲";
    var gap=s.age-s.c.e;
    var cmp=gap>=3?"比當地平均預期壽命長了約 "+gap+" 年。":gap<=-3?"比當地平均預期壽命短了約 "+(-gap)+" 年。":"和當地平均預期壽命相近。";
    $("sum").innerHTML="";
    [["家世",TIER[s.fam]],["健康",Math.round(s.h)],["財富",Math.round(s.w)],["學識",Math.round(s.k)],["快樂",Math.round(s.j)],["人際關係",Math.round(s.r)],["最終存款",NT(s.sav)],["負債",NT(s.debt+s.mort)],["給予的金錢",s.gift>0?NT(s.gift):"無"],["個性",PTN[s.pt]||"未定"],["八字",s.bz.txt],["最高學歷",s.deg?LVN[s.deg]:"高中以下"],["最後學校",s.edu.length?s.edu[s.edu.length-1]:"未升學"],["主修",s.major||"無"],["兵役",s.milDone?"已服役":SVCD[s.c.k]?"未服役":"無義務"],["證照",s.cert.length?certText():"無"],["MBTI",mbtiStr()||"未測"],["黨籍",s.pty?s.pty.n:"無"],["政治生涯",s.pol>0?POLNm(s.pol):s.exPol?"曾任"+POLNm(s.exPol):"未從政"],["伴侶",s.partner?s.partner.job:"無"],["子女",s.kids.length+" 人"]].forEach(function(r){
      var d=document.createElement("div");d.innerHTML="<span></span><b></b>";d.firstChild.textContent=r[0];d.lastChild.textContent=r[1];$("sum").appendChild(d);
    });
    var p=document.createElement("p");p.className="note";p.textContent=cmp;$("sum").appendChild(p);
    s.peers.forEach(function(q){var x=document.createElement('p');x.className='note';x.textContent='同一秒出生：在'+q.c.n+'，'+(s.age>=q.d?q.d+' 歲離世':'至今仍在世')+'。';$('sum').appendChild(x)});
    s.notes.forEach(function(n){var x=document.createElement('p');x.className='note';x.textContent=n;$('sum').appendChild(x)});
    $('fw').value='';$('fw').disabled=false;
    show("end");
  },1600);
}
function frame(ts){
  requestAnimationFrame(frame);
  var dt=last?Math.min(100,ts-last):16;last=ts;TT=ts;
  if(s&&s.running&&s.alive){
    advance(dt);
    $('pgi').style.width=(s.yp/YMS*100)+'%';
    var sec=Math.max(0,Math.ceil((YMS-s.yp)/speeds[s.sp]/1000));
    $('cd').textContent='下一歲倒數 '+sec+' 秒'+(s.paused?'（已暫停）':s.wait?'（等待抉擇）':'');
    drawScene();
  }
}
